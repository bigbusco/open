<!doctype html>
<html><head><meta charset="utf-8"><title>Opening Gmail</title>
<script>
(function () {
  var t = 'https://mail.google.com/mail/?authuser=admin@bigbusco.com.au' + location.hash;
  // If the Gmail tab that opened us is reachable, send it to the draft and close this tab.
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.location.href = t;
      window.close();
      return;
    }
  } catch (e) {}
  location.replace(t);
})();
</script>
</head><body style="font-family:Arial,sans-serif;color:#555">Opening Gmail...</body></html>
